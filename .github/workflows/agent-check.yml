name: Agent checks
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  baseline-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install existing lint tool
        run: python -m pip install 'ruff>=0.8'
      - name: Test the guard with isolated local remotes
        run: python -m unittest discover -s scripts/tests -p test_agent_check.py
      - name: Check actual PR head against fresh base and lint changed Python
        env:
          AGENT_BASE: ${{ github.base_ref }}
        run: python scripts/agent_check.py --base "$AGENT_BASE" --lint
